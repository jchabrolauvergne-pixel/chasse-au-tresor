<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chasse au trésor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --encre:#3b2414;
    --encre-claire:#6b4426;
    --sang:#8a1c14;
    --cire:#9e1b16;
    --cire-sombre:#5e0d0a;
    --or:#b8862e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"IM Fell English",Georgia,serif;
    color:var(--encre);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(ellipse at 50% 40%, #3a2a1c 0%, #1a110a 70%, #0d0805 100%);
  }
  /* Parchemin */
  .parchemin{
    position:relative;
    width:min(560px,100%);
    padding:64px 52px 72px;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,250,230,.55), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(120,70,20,.35), transparent 50%),
      radial-gradient(ellipse at 10% 95%, rgba(110,60,15,.30), transparent 40%),
      radial-gradient(ellipse at 95% 5%, rgba(110,60,15,.28), transparent 35%),
      linear-gradient(160deg,#f3e3bf 0%,#e8d1a0 45%,#dcbd83 100%);
    box-shadow:
      inset 0 0 60px rgba(90,50,10,.55),
      inset 0 0 12px rgba(90,50,10,.4),
      0 30px 80px rgba(0,0,0,.6);
    clip-path:polygon(1% 2%,6% 0%,14% 1.5%,22% .3%,31% 1.8%,40% .4%,52% 1.6%,61% .2%,70% 1.4%,79% .1%,88% 1.7%,96% .5%,99.5% 3%,
      98.6% 12%,100% 23%,98.8% 34%,99.8% 46%,98.5% 58%,100% 69%,98.7% 80%,99.7% 91%,98.4% 98.5%,
      92% 99.4%,83% 98.3%,74% 100%,64% 98.6%,55% 99.8%,45% 98.4%,35% 99.9%,25% 98.5%,15% 99.7%,6% 98.6%,.8% 99.3%,
      1.6% 88%,0% 77%,1.4% 66%,.2% 54%,1.6% 43%,0% 31%,1.3% 20%,.3% 9%);
    text-align:center;
    animation:deroule .9s ease-out both;
  }
  @keyframes deroule{from{opacity:0;transform:scaleY(.6) translateY(-20px)}to{opacity:1;transform:none}}
  .parchemin::before{ /* taches et grain */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .05  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .rose{width:84px;height:84px;margin:0 auto 14px;opacity:.85}
  h1{
    font-family:"Cinzel Decorative",serif;font-weight:700;
    font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:.02em;
    color:var(--sang);
    text-shadow:0 1px 0 rgba(255,240,200,.6);
    line-height:1.15;
  }
  .ornement{display:block;margin:16px auto 20px;width:220px;height:14px;color:var(--encre-claire)}
  .intro{font-style:italic;font-size:1.18rem;line-height:1.55;margin-bottom:30px;color:var(--encre)}
  .intro b{font-style:normal;font-family:"IM Fell English SC",serif;font-weight:normal;letter-spacing:.04em}

  form{position:relative}
  .date{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:28px}
  .champ{display:flex;flex-direction:column;align-items:center;gap:6px}
  .champ label{font-family:"IM Fell English SC",serif;font-size:.95rem;color:var(--encre-claire);letter-spacing:.06em}
  .champ input{
    font-family:"IM Fell English",serif;font-size:1.9rem;text-align:center;color:var(--encre);
    background:transparent;border:none;border-bottom:2px solid var(--encre-claire);
    outline:none;padding:2px 0;
    -moz-appearance:textfield;
  }
  .champ input::-webkit-outer-spin-button,.champ input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .champ input::placeholder{color:rgba(107,68,38,.35)}
  .champ input:focus{border-bottom-color:var(--sang)}
  #jour,#mois{width:2.4em}
  #annee{width:3.6em}
  .sep{font-size:1.9rem;color:var(--encre-claire);padding-bottom:6px}

  /* Cœur de cire = bouton */
  .sceau{
    position:relative;display:block;width:128px;height:118px;margin:0 auto;
    border:none;background:none;cursor:pointer;padding:0;
    filter:drop-shadow(0 7px 10px rgba(60,10,5,.55));
    transition:transform .2s ease, filter .2s ease;
  }
  .sceau svg.coeur{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .sceau .libelle{
    position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);
    color:#f8dfb8;font-family:"Cinzel Decorative",serif;font-size:.82rem;letter-spacing:.08em;
    text-shadow:0 1px 1px rgba(60,5,5,.7);pointer-events:none;
  }
  .sceau:hover{transform:scale(1.07)}
  .sceau:hover svg.coeur{animation:bat 1s ease-in-out infinite}
  .sceau:active{transform:scale(.95)}
  .sceau:disabled{cursor:wait}
  .sceau.charge{animation:bat .7s ease-in-out infinite}
  @keyframes bat{0%,100%{transform:scale(1)}15%{transform:scale(1.09)}30%{transform:scale(.98)}45%{transform:scale(1.06)}}

  .message{min-height:1.6em;margin-top:22px;font-style:italic;font-size:1.1rem;color:var(--sang)}
  .tremble{animation:tremble .45s}
  @keyframes tremble{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* Révélation */
  #revelation{display:none}
  #revelation.visible{display:block;animation:apparait 1.4s ease-out both}
  @keyframes apparait{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
  #revelation h2{font-family:"Cinzel Decorative",serif;color:var(--sang);font-size:clamp(1.5rem,4.5vw,2rem);margin-bottom:6px}
  #contenu{font-size:1.28rem;line-height:1.6;white-space:pre-line;margin-top:6px}
  .croix{display:block;margin:26px auto 0;width:58px;height:58px;color:var(--sang);opacity:.85}
  .rejouer{margin-top:22px;background:none;border:none;font-family:"IM Fell English",serif;font-style:italic;font-size:1rem;color:var(--encre-claire);text-decoration:underline;cursor:pointer}

  @media (max-width:480px){
    .parchemin{padding:52px 26px 60px}
    .champ input{font-size:1.6rem}
  }
</style>
</head>
<body>
<main class="parchemin">

  <svg class="rose" viewBox="0 0 100 100" aria-hidden="true" fill="none" stroke="currentColor" style="color:var(--encre-claire)">
    <circle cx="50" cy="50" r="44" stroke-width="1.2"/>
    <circle cx="50" cy="50" r="36" stroke-width=".7" stroke-dasharray="2 3"/>
    <path d="M50 4 L56 44 L50 50 L44 44 Z" fill="var(--sang)" stroke="none"/>
    <path d="M50 96 L44 56 L50 50 L56 56 Z" fill="currentColor" stroke="none"/>
    <path d="M96 50 L56 56 L50 50 L56 44 Z" fill="currentColor" stroke="none" opacity=".75"/>
    <path d="M4 50 L44 44 L50 50 L44 56 Z" fill="currentColor" stroke="none" opacity=".75"/>
    <path d="M50 50 L78 22 M50 50 L22 78 M50 50 L78 78 M50 50 L22 22" stroke-width=".9"/>
    <circle cx="50" cy="50" r="3" fill="var(--encre)" stroke="none"/>
  </svg>

  <section id="enigme">
    <h1>Le Coffre Scellé</h1>
    <svg class="ornement" viewBox="0 0 220 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M0 7 H85 M135 7 H220"/><path d="M90 7 q10 -9 20 0 q10 9 20 0"/><circle cx="110" cy="7" r="2.2" fill="currentColor"/>
    </svg>
    <p class="intro">Nous avons partagé ce jour-là un bol de cidre en Bretagne…</p>

    <form id="formulaire" autocomplete="off" novalidate>
      <div class="date">
        <div class="champ"><label for="jour">Jour</label><input id="jour" inputmode="numeric" maxlength="2" placeholder="JJ" required></div>
        <span class="sep">/</span>
        <div class="champ"><label for="mois">Mois</label><input id="mois" inputmode="numeric" maxlength="2" placeholder="MM" required></div>
        <span class="sep">/</span>
        <div class="champ"><label for="annee">Année</label><input id="annee" inputmode="numeric" maxlength="4" placeholder="AAAA" required></div>
      </div>

      <button class="sceau" id="bouton" type="submit" aria-label="Ouvrir">
        <svg class="coeur" viewBox="0 0 128 118" aria-hidden="true">
          <defs>
            <radialGradient id="cire" cx="35%" cy="28%" r="80%">
              <stop offset="0" stop-color="#e05a4b"/>
              <stop offset=".4" stop-color="#9e1b16"/>
              <stop offset="1" stop-color="#4f0a08"/>
            </radialGradient>
          </defs>
          <!-- coulure irrégulière de la cire -->
          <path d="M64 114 C58 108 48 101 38 93 C24 82 6 68 5 45 C4 24 18 6 37 6 C49 6 58 13 64 23 C70 13 79 6 91 6 C110 6 124 24 123 45 C122 68 104 82 90 93 C80 101 70 108 64 114 Z"
                fill="#5e0d0a" transform="translate(-2 1) scale(1.02)"/>
          <path d="M64 108 C51 97 14 74 13 45 C12 27 24 13 39 13 C50 13 59 21 64 31 C69 21 78 13 89 13 C104 13 116 27 115 45 C114 74 77 97 64 108 Z"
                fill="url(#cire)"/>
          <!-- empreinte du cachet -->
          <path d="M64 92 C54 84 28 67 28 47 C28 35 36 27 45 27 C53 27 59 33 64 41 C69 33 75 27 83 27 C92 27 100 35 100 47 C100 67 74 84 64 92 Z"
                fill="none" stroke="rgba(255,190,160,.35)" stroke-width="2"/>
          <ellipse cx="42" cy="34" rx="10" ry="6" fill="rgba(255,200,180,.28)" transform="rotate(-30 42 34)"/>
        </svg>
        <span class="libelle">Ouvrir</span>
      </button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="revelation" aria-live="polite">
    <h2 id="titre"></h2>
    <svg class="ornement" viewBox="0 0 220 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.2">
      <path d="M0 7 H85 M135 7 H220"/><path d="M90 7 q10 -9 20 0 q10 9 20 0"/><circle cx="110" cy="7" r="2.2" fill="currentColor"/>
    </svg>
    <p id="contenu"></p>
    <svg class="croix" viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M14 14 L46 46 M46 14 L14 46"/>
    </svg>
    <button class="rejouer" id="rejouer" type="button">Refermer le parchemin</button>
  </section>

</main>

<script>
  // Connexion Supabase (clé publique : elle ne donne accès qu'à la fonction de vérification)
  const SUPABASE_URL = "https://ggyuqlrqveuohkmuugcs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_mT_-VQujFonVn-MOQneApw_8GscK7Of";

  const $ = id => document.getElementById(id);
  const jour = $("jour"), mois = $("mois"), annee = $("annee");
  const bouton = $("bouton"), message = $("message"), form = $("formulaire");

  // Saisie : chiffres seulement, passage automatique au champ suivant
  [[jour, mois], [mois, annee], [annee, null]].forEach(([champ, suivant]) => {
    champ.addEventListener("input", () => {
      champ.value = champ.value.replace(/\D/g, "");
      if (suivant && champ.value.length >= champ.maxLength) suivant.focus();
      message.textContent = "";
    });
  });
  [[mois, jour], [annee, mois]].forEach(([champ, precedent]) => {
    champ.addEventListener("keydown", e => {
      if (e.key === "Backspace" && champ.value === "") precedent.focus();
    });
  });

  function erreur(texte) {
    message.textContent = texte;
    form.classList.remove("tremble"); void form.offsetWidth; form.classList.add("tremble");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const j = parseInt(jour.value, 10), m = parseInt(mois.value, 10), a = parseInt(annee.value, 10);
    if (!j || !m || !a || annee.value.length !== 4 || j > 31 || m > 12) {
      return erreur("Le parchemin réclame une date complète : jour, mois et année.");
    }
    const reponse = `${a}-${String(m).padStart(2, "0")}-${String(j).padStart(2, "0")}`;

    bouton.disabled = true; bouton.classList.add("charge");
    message.textContent = "Le sceau résiste…";
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/chasse_verifier`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
        body: JSON.stringify({ p_reponse: reponse })
      });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (data.ok) {
        $("titre").textContent = data.titre || "Le sceau est brisé !";
        $("contenu").textContent = data.contenu;
        $("enigme").style.display = "none";
        $("revelation").classList.add("visible");
      } else if (data.erreur === "trop_de_tentatives") {
        erreur("Trop d'essais… Le sceau se refroidit. Patiente une minute.");
      } else {
        erreur("Ce n'est pas la bonne date. Le sceau reste intact.");
      }
    } catch (err) {
      erreur("Le messager n'a pu atteindre le coffre. Réessaie dans un instant.");
    } finally {
      bouton.disabled = false; bouton.classList.remove("charge");
      if (message.textContent === "Le sceau résiste…") message.textContent = "";
    }
  });

  $("rejouer").addEventListener("click", () => {
    $("revelation").classList.remove("visible");
    $("enigme").style.display = "";
    jour.value = mois.value = annee.value = ""; message.textContent = "";
    jour.focus();
  });
</script>
</body>
</html>
