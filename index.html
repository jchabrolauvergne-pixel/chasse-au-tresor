<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une lettre pour toi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --encre:#4a1f26;
    --encre-douce:#8a4a52;
    --rose:#c2405a;
    --carmin:#9b1b30;
    --cire:#a3152b;
    --cire-sombre:#540814;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Cormorant Garamond",Georgia,serif;
    color:var(--encre);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:36px 16px;
    overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% 35%, #6e1f33 0%, #3d0d1b 55%, #1e0610 100%);
  }

  /* Cœurs qui flottent en arrière-plan */
  .ciel{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .ciel span{
    position:absolute;bottom:-40px;
    width:var(--t);height:var(--t);
    opacity:0;
    animation:monte var(--d) linear var(--r) infinite;
    color:#e98aa0;
  }
  .ciel span svg{width:100%;height:100%;display:block;animation:balance 3s ease-in-out infinite alternate}
  @keyframes monte{
    0%{transform:translateY(0);opacity:0}
    10%{opacity:var(--o)}
    85%{opacity:var(--o)}
    100%{transform:translateY(-110vh);opacity:0}
  }
  @keyframes balance{from{transform:translateX(-12px) rotate(-12deg)}to{transform:translateX(12px) rotate(12deg)}}

  /* La lettre */
  .lettre{
    position:relative;z-index:1;
    width:min(560px,100%);
    padding:60px 54px 64px;
    border-radius:4px;
    background:
      radial-gradient(ellipse at 20% 12%, rgba(255,250,246,.85), transparent 55%),
      radial-gradient(ellipse at 88% 92%, rgba(214,140,150,.30), transparent 50%),
      radial-gradient(ellipse at 6% 96%, rgba(200,120,130,.22), transparent 40%),
      linear-gradient(165deg,#fdf3ee 0%,#f8e4dc 50%,#f1d3cb 100%);
    box-shadow:
      inset 0 0 50px rgba(160,70,80,.22),
      0 30px 80px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.2);
    text-align:center;
    animation:arrive 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes arrive{from{opacity:0;transform:translateY(30px) rotate(-1.5deg)}to{opacity:1;transform:rotate(-.4deg)}}
  .lettre::before{ /* double filet doré-rosé */
    content:"";position:absolute;inset:14px;border:1px solid rgba(155,27,48,.28);border-radius:2px;pointer-events:none;
    box-shadow:inset 0 0 0 4px rgba(253,243,238,.0), inset 0 0 0 5px rgba(155,27,48,.14);
  }
  .lettre::after{ /* grain du papier */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;border-radius:4px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .2  0 0 0 0 .25  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* coins fleuris */
  .coin{position:absolute;width:58px;height:58px;color:var(--rose);opacity:.55}
  .coin.hg{top:20px;left:20px}
  .coin.hd{top:20px;right:20px;transform:scaleX(-1)}
  .coin.bg{bottom:20px;left:20px;transform:scaleY(-1)}
  .coin.bd{bottom:20px;right:20px;transform:scale(-1,-1)}

  .emblème{width:92px;height:70px;margin:0 auto 6px;display:block}
  h1{
    font-family:"Pinyon Script",cursive;font-weight:400;
    font-size:clamp(2.6rem,8vw,3.6rem);
    color:var(--carmin);
    line-height:1.1;
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .ornement{display:block;margin:12px auto 22px;width:240px;height:18px;color:var(--rose)}
  .intro{font-style:italic;font-size:1.42rem;line-height:1.5;margin-bottom:30px;color:var(--encre)}

  form{position:relative}
  .date{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin-bottom:30px}
  .champ{display:flex;flex-direction:column;align-items:center;gap:4px}
  .champ label{font-size:1rem;font-style:italic;color:var(--encre-douce);letter-spacing:.04em}
  .champ input{
    font-family:"Cormorant Garamond",serif;font-weight:500;font-size:2rem;text-align:center;color:var(--encre);
    background:transparent;border:none;border-bottom:1.5px solid rgba(155,27,48,.45);
    outline:none;padding:0 0 2px;
    -moz-appearance:textfield;
    transition:border-color .2s;
  }
  .champ input::-webkit-outer-spin-button,.champ input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .champ input::placeholder{color:rgba(138,74,82,.3)}
  .champ input:focus{border-bottom-color:var(--rose)}
  #jour,#mois{width:2.3em}
  #annee{width:3.4em}
  .sep{font-size:1.6rem;color:var(--rose);padding-bottom:8px}

  /* Cœur de cire = bouton */
  .sceau{
    position:relative;display:block;width:128px;height:118px;margin:0 auto;
    border:none;background:none;cursor:pointer;padding:0;
    filter:drop-shadow(0 7px 10px rgba(84,8,20,.45));
    transition:transform .2s ease;
    animation:bat 1.6s ease-in-out infinite;
  }
  .sceau svg.coeur{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .sceau .libelle{
    position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);
    color:#ffe6e0;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:1.1rem;letter-spacing:.04em;
    text-shadow:0 1px 1px rgba(60,5,10,.7);pointer-events:none;
  }
  .sceau:hover{animation-duration:.9s}
  .sceau:active{transform:scale(.94)}
  .sceau:disabled{cursor:wait}
  .sceau.charge{animation:bat .55s ease-in-out infinite}
  @keyframes bat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(.99)}42%{transform:scale(1.05)}60%{transform:scale(1)}}

  .message{min-height:1.6em;margin-top:22px;font-style:italic;font-size:1.2rem;color:var(--carmin)}
  .tremble{animation:tremble .45s}
  @keyframes tremble{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  /* Révélation */
  #revelation{display:none}
  #revelation.visible{display:block;animation:apparait 1.6s ease-out both}
  @keyframes apparait{from{opacity:0;filter:blur(6px);transform:scale(.97)}to{opacity:1;filter:none;transform:none}}
  #revelation h2{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--carmin);font-size:clamp(2.3rem,7vw,3.1rem);line-height:1.15}
  #contenu{font-size:1.45rem;line-height:1.6;white-space:pre-line;margin-top:4px}
  .grand-coeur{display:block;margin:26px auto 0;width:60px;height:56px;color:var(--rose);animation:bat 1.6s ease-in-out infinite}
  .rejouer{margin-top:20px;background:none;border:none;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.05rem;color:var(--encre-douce);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

  /* Pluie de cœurs à la réussite */
  .eclat{position:fixed;z-index:5;pointer-events:none;width:var(--t);height:var(--t);color:var(--c);
    animation:jaillit var(--d) cubic-bezier(.15,.7,.3,1) forwards}
  .eclat svg{width:100%;height:100%;display:block}
  @keyframes jaillit{
    0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
    100%{transform:translate(var(--x),var(--y)) scale(1) rotate(var(--rot));opacity:0}
  }

  @media (max-width:480px){
    .lettre{padding:54px 28px 58px}
    .coin{width:42px;height:42px}
    .champ input{font-size:1.7rem}
    .intro{font-size:1.28rem}
  }
  @media (prefers-reduced-motion:reduce){
    .ciel{display:none}
    .sceau,.grand-coeur{animation:none}
  }
</style>
</head>
<body>

<div class="ciel" id="ciel" aria-hidden="true"></div>

<main class="lettre">

  <!-- coins fleuris -->
  <svg class="coin hg" viewBox="0 0 60 60" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
    <path d="M4 56 C4 30 14 14 40 6"/><path d="M4 56 C10 40 22 30 36 26"/>
    <path d="M18 24 c-6 -2 -9 -8 -6 -12 c5 1 8 6 6 12z" fill="currentColor" opacity=".35"/>
    <path d="M28 14 c-2 -6 1 -11 6 -11 c1 5 -2 9 -6 11z" fill="currentColor" opacity=".35"/>
    <path d="M10 38 c-6 0 -9 -5 -8 -9 c5 0 8 4 8 9z" fill="currentColor" opacity=".35"/>
    <path d="M44 9 c-2.5 -2.5 -6 -1 -6 2 c0 3 6 6 6 6 s6 -3 6 -6 c0 -3 -3.5 -4.5 -6 -2z" fill="currentColor" stroke="none" opacity=".8"/>
  </svg>
  <svg class="coin hd" viewBox="0 0 60 60" aria-hidden="true"><use href="#coin-motif"/></svg>
  <svg class="coin bg" viewBox="0 0 60 60" aria-hidden="true"><use href="#coin-motif"/></svg>
  <svg class="coin bd" viewBox="0 0 60 60" aria-hidden="true"><use href="#coin-motif"/></svg>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="coin-motif" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round">
        <path d="M4 56 C4 30 14 14 40 6"/><path d="M4 56 C10 40 22 30 36 26"/>
        <path d="M18 24 c-6 -2 -9 -8 -6 -12 c5 1 8 6 6 12z" fill="currentColor" opacity=".35"/>
        <path d="M28 14 c-2 -6 1 -11 6 -11 c1 5 -2 9 -6 11z" fill="currentColor" opacity=".35"/>
        <path d="M10 38 c-6 0 -9 -5 -8 -9 c5 0 8 4 8 9z" fill="currentColor" opacity=".35"/>
        <path d="M44 9 c-2.5 -2.5 -6 -1 -6 2 c0 3 6 6 6 6 s6 -3 6 -6 c0 -3 -3.5 -4.5 -6 -2z" fill="currentColor" stroke="none" opacity=".8"/>
      </g>
      <path id="petit-coeur" d="M12 21 C10 19 2 14 2 8 C2 4.5 4.6 2 7.6 2 C9.6 2 11.2 3.2 12 5 C12.8 3.2 14.4 2 16.4 2 C19.4 2 22 4.5 22 8 C22 14 14 19 12 21 Z"/>
    </defs>
  </svg>

  <section id="enigme">
    <!-- deux cœurs entrelacés -->
    <svg class="emblème" viewBox="0 0 92 70" aria-hidden="true">
      <path d="M36 62 C30 57 6 43 6 25 C6 15 13 8 22 8 C28 8 33 11 36 17 C39 11 44 8 50 8 C59 8 66 15 66 25 C66 43 42 57 36 62 Z"
            fill="none" stroke="#c2405a" stroke-width="2.2"/>
      <path d="M56 64 C50 59 26 45 26 27 C26 17 33 10 42 10 C48 10 53 13 56 19 C59 13 64 10 70 10 C79 10 86 17 86 27 C86 45 62 59 56 64 Z"
            fill="rgba(194,64,90,.16)" stroke="#9b1b30" stroke-width="2.2"/>
    </svg>

    <h1>Une lettre pour toi</h1>
    <svg class="ornement" viewBox="0 0 240 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M0 9 H96 M144 9 H240"/>
      <path d="M96 9 q6 -6 12 0 M132 9 q6 6 12 0"/>
      <path transform="translate(110 1) scale(.83)" d="M12 21 C10 19 2 14 2 8 C2 4.5 4.6 2 7.6 2 C9.6 2 11.2 3.2 12 5 C12.8 3.2 14.4 2 16.4 2 C19.4 2 22 4.5 22 8 C22 14 14 19 12 21 Z" fill="currentColor" stroke="none"/>
    </svg>

    <p class="intro">Nous avons partagé ce jour-là un bol de cidre en Bretagne…</p>

    <form id="formulaire" autocomplete="off" novalidate>
      <div class="date">
        <div class="champ"><label for="jour">jour</label><input id="jour" inputmode="numeric" maxlength="2" placeholder="JJ" required></div>
        <span class="sep">♥</span>
        <div class="champ"><label for="mois">mois</label><input id="mois" inputmode="numeric" maxlength="2" placeholder="MM" required></div>
        <span class="sep">♥</span>
        <div class="champ"><label for="annee">année</label><input id="annee" inputmode="numeric" maxlength="4" placeholder="AAAA" required></div>
      </div>

      <button class="sceau" id="bouton" type="submit" aria-label="Ouvrir la lettre">
        <svg class="coeur" viewBox="0 0 128 118" aria-hidden="true">
          <defs>
            <radialGradient id="cire" cx="35%" cy="28%" r="80%">
              <stop offset="0" stop-color="#e8606e"/>
              <stop offset=".42" stop-color="#a3152b"/>
              <stop offset="1" stop-color="#4a0712"/>
            </radialGradient>
          </defs>
          <path d="M64 114 C58 108 48 101 38 93 C24 82 6 68 5 45 C4 24 18 6 37 6 C49 6 58 13 64 23 C70 13 79 6 91 6 C110 6 124 24 123 45 C122 68 104 82 90 93 C80 101 70 108 64 114 Z"
                fill="#540814" transform="translate(-2 1) scale(1.02)"/>
          <path d="M64 108 C51 97 14 74 13 45 C12 27 24 13 39 13 C50 13 59 21 64 31 C69 21 78 13 89 13 C104 13 116 27 115 45 C114 74 77 97 64 108 Z"
                fill="url(#cire)"/>
          <path d="M64 92 C54 84 28 67 28 47 C28 35 36 27 45 27 C53 27 59 33 64 41 C69 33 75 27 83 27 C92 27 100 35 100 47 C100 67 74 84 64 92 Z"
                fill="none" stroke="rgba(255,200,190,.35)" stroke-width="2"/>
          <ellipse cx="42" cy="34" rx="10" ry="6" fill="rgba(255,215,210,.3)" transform="rotate(-30 42 34)"/>
        </svg>
        <span class="libelle">Ouvrir</span>
      </button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="revelation" aria-live="polite">
    <h2 id="titre"></h2>
    <svg class="ornement" viewBox="0 0 240 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M0 9 H96 M144 9 H240"/>
      <path d="M96 9 q6 -6 12 0 M132 9 q6 6 12 0"/>
      <path transform="translate(110 1) scale(.83)" d="M12 21 C10 19 2 14 2 8 C2 4.5 4.6 2 7.6 2 C9.6 2 11.2 3.2 12 5 C12.8 3.2 14.4 2 16.4 2 C19.4 2 22 4.5 22 8 C22 14 14 19 12 21 Z" fill="currentColor" stroke="none"/>
    </svg>
    <p id="contenu"></p>
    <svg class="grand-coeur" viewBox="0 0 24 23" aria-hidden="true"><use href="#petit-coeur" fill="currentColor"/></svg>
    <button class="rejouer" id="rejouer" type="button">Refermer la lettre</button>
  </section>

</main>

<script>
  // Connexion Supabase (clé publique : elle ne donne accès qu'à la fonction de vérification)
  const SUPABASE_URL = "https://ggyuqlrqveuohkmuugcs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_mT_-VQujFonVn-MOQneApw_8GscK7Of";

  const $ = id => document.getElementById(id);
  const jour = $("jour"), mois = $("mois"), annee = $("annee");
  const bouton = $("bouton"), message = $("message"), form = $("formulaire");
  const COEUR = '<svg viewBox="0 0 24 23"><use href="#petit-coeur" fill="currentColor"/></svg>';
  const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Cœurs qui flottent en arrière-plan
  (function () {
    const ciel = $("ciel");
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("span");
      s.innerHTML = COEUR;
      s.style.left = (Math.random() * 100) + "vw";
      s.style.setProperty("--t", (10 + Math.random() * 22) + "px");
      s.style.setProperty("--d", (12 + Math.random() * 14) + "s");
      s.style.setProperty("--r", (-Math.random() * 24) + "s");
      s.style.setProperty("--o", (.25 + Math.random() * .45).toFixed(2));
      ciel.appendChild(s);
    }
  })();

  // Pluie de cœurs depuis le bouton
  function gerbe() {
    if (reduit) return;
    const r = bouton.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const teintes = ["#c2405a", "#e98aa0", "#9b1b30", "#f4b6c2", "#d9566f"];
    for (let i = 0; i < 46; i++) {
      const e = document.createElement("span");
      e.className = "eclat";
      e.innerHTML = COEUR;
      const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 280;
      e.style.left = (cx - 10) + "px"; e.style.top = (cy - 10) + "px";
      e.style.setProperty("--x", Math.cos(ang) * dist + "px");
      e.style.setProperty("--y", (Math.sin(ang) * dist - 80) + "px");
      e.style.setProperty("--t", (12 + Math.random() * 20) + "px");
      e.style.setProperty("--d", (1.2 + Math.random() * 1.1) + "s");
      e.style.setProperty("--rot", (Math.random() * 120 - 60) + "deg");
      e.style.setProperty("--c", teintes[i % teintes.length]);
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 2600);
    }
  }

  // Saisie : chiffres seulement, passage automatique au champ suivant
  [[jour, mois], [mois, annee], [annee, null]].forEach(([champ, suivant]) => {
    champ.addEventListener("input", () => {
      champ.value = champ.value.replace(/\D/g, "");
      if (suivant && champ.value.length >= champ.maxLength) suivant.focus();
      message.textContent = "";
    });
  });
  [[mois, jour], [annee, mois]].forEach(([champ, precedent]) => {
    champ.addEventListener("keydown", e => {
      if (e.key === "Backspace" && champ.value === "") precedent.focus();
    });
  });

  function erreur(texte) {
    message.textContent = texte;
    form.classList.remove("tremble"); void form.offsetWidth; form.classList.add("tremble");
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const j = parseInt(jour.value, 10), m = parseInt(mois.value, 10), a = parseInt(annee.value, 10);
    if (!j || !m || !a || annee.value.length !== 4 || j > 31 || m > 12) {
      return erreur("Il me faut le jour, le mois et l'année…");
    }
    const reponse = `${a}-${String(m).padStart(2, "0")}-${String(j).padStart(2, "0")}`;

    bouton.disabled = true; bouton.classList.add("charge");
    message.textContent = "Mon cœur bat…";
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/chasse_verifier`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
        body: JSON.stringify({ p_reponse: reponse })
      });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (data.ok) {
        gerbe();
        $("titre").textContent = data.titre || "Tu t'en souviens…";
        $("contenu").textContent = data.contenu;
        setTimeout(() => {
          $("enigme").style.display = "none";
          $("revelation").classList.add("visible");
        }, reduit ? 0 : 450);
      } else if (data.erreur === "trop_de_tentatives") {
        erreur("Doucement… laisse passer une minute avant de réessayer.");
      } else {
        erreur("Ce n'est pas ce jour-là… cherche encore dans tes souvenirs.");
      }
    } catch (err) {
      erreur("La lettre n'a pas pu être ouverte. Réessaie dans un instant.");
    } finally {
      bouton.disabled = false; bouton.classList.remove("charge");
      if (message.textContent === "Mon cœur bat…") message.textContent = "";
    }
  });

  $("rejouer").addEventListener("click", () => {
    $("revelation").classList.remove("visible");
    $("enigme").style.display = "";
    jour.value = mois.value = annee.value = ""; message.textContent = "";
    jour.focus();
  });
</script>
</body>
</html>
